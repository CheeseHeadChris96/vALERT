name: Pull request validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Valert.Tests --configuration Release
